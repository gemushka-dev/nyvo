[package]
name = "nyvodb"
version = "0.1.0"
edition = "2024"

[dependencies]
deadpool-postgres = "0.14.2"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow","default_fonts","persistence",] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlparser = "0.63.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
uuid = { version = "1", features = ["v4"] }
